  <script>
    (function () {
      var QR_GUIDE_ALBUM_SRCS = [
        '/static/images/qr-guide/url-qr.png',
        '/static/images/qr-guide/android1.jpg',
        '/static/images/qr-guide/ios1.jpg'
      ];
      var QR_GUIDE_DOWNLOAD_NAMES = [
        '众创之门二维码.png',
        '安卓打开方法.jpg',
        '苹果打开方法.jpg'
      ];

      function downloadQrGuideImageByIndex(index) {
        if (index < 0 || index >= QR_GUIDE_ALBUM_SRCS.length) return;
        var url = QR_GUIDE_ALBUM_SRCS[index];
        var filename = QR_GUIDE_DOWNLOAD_NAMES[index];
        fetch(url)
          .then(function (r) {
            if (!r.ok) throw new Error(r.statusText);
            return r.blob();
          })
          .then(function (blob) {
            var u = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = u;
            a.download = filename;
            a.rel = 'noopener';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(u);
          })
          .catch(function (err) {
            console.error('QR guide download failed:', err);
          });
      }

      window.downloadQr = function (e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        downloadQrGuideImageByIndex(0);
        var target = document.getElementById('qr-guide');
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else {
          location.hash = '#qr-guide';
        }
      };
    })();
  </script>
